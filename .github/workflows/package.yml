name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hub_tag:
        description: "Optional avn-hub release tag (e.g. v0.2.3). Empty = latest release."
        required: false
        default: ""

concurrency:
  group: afterglow-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      hub_tag: ${{ steps.hub.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Afterglow.sln

      - name: Build
        run: dotnet build src/Afterglow/Afterglow.csproj -c Release -f net8.0-windows --no-restore

      - name: Resolve hub Windows sidecar
        id: hub
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HUB_GITHUB_TOKEN || github.token }}
          HUB_TAG: ${{ github.event.inputs.hub_tag }}
          HUB_REPO: ${{ vars.HUB_REPO || 'goonedoutgames/avn-hub' }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "$env:HUB_TAG".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = gh release view --repo $env:HUB_REPO --json tagName --jq .tagName
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Could not resolve latest release tag for $($env:HUB_REPO)"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using hub release: $tag"

          New-Item -ItemType Directory -Force -Path sidecar-dl | Out-Null
          gh release download $tag --repo $env:HUB_REPO `
            --pattern "avn-hub-windows-x64.exe" `
            --dir sidecar-dl --clobber
          if (-not (Test-Path "sidecar-dl/avn-hub-windows-x64.exe")) {
            gh release download $tag --repo $env:HUB_REPO `
              --pattern "avn-hub.exe" `
              --dir sidecar-dl --clobber
          }
          $src = @("sidecar-dl/avn-hub-windows-x64.exe", "sidecar-dl/avn-hub.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) { throw "No Windows avn-hub binary on release $tag" }
          "path=$src" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish Windows package
        shell: pwsh
        run: |
          ./packaging/publish-windows.ps1 `
            -Configuration Release `
            -Runtime win-x64 `
            -Framework net8.0-windows `
            -AvnHubExe "${{ steps.hub.outputs.path }}" `
            -Output publish/windows

      - name: Sidecar provenance
        shell: pwsh
        run: |
          @"
          Bundled AVN Hub sidecar (Windows)
          =================================
          Source repo : ${{ vars.HUB_REPO || 'goonedoutgames/avn-hub' }}
          Release tag : ${{ steps.hub.outputs.tag }}
          Asset       : ${{ steps.hub.outputs.path }}
          Built at    : $(Get-Date -Format o)
          "@ | Set-Content publish/windows/sidecar/SIDECAR.txt

      - name: Zip Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/windows/* -DestinationPath Afterglow-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Afterglow-windows-x64
          path: Afterglow-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Afterglow-windows-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Afterglow desktop (Windows)

            `Afterglow-windows-x64.zip` — includes Afterglow Browser (WebView2) and the Windows hub sidecar when available.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
