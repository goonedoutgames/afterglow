name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hub_tag:
        description: "Optional avn-hub release tag (e.g. v0.2.3). Empty = latest release."
        required: false
        default: ""

concurrency:
  group: afterglow-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Skip packaging for docs/screenshot-only branch and PR pushes.
  # Tags and workflow_dispatch always run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Always-run event (${{ github.event_name }} / ${{ github.ref }})"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No valid base SHA; building"
            exit 0
          fi

          mapfile -t files < <(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          printf '  %s\n' "${files[@]}"

          should=false
          for f in "${files[@]}"; do
            case "$f" in
              *.md|assets/screenshots/*|LICENSE|.gitignore|.gitattributes|.cursor/*)
                continue
                ;;
              # Source art used only for README / IconTool inputs — not packaged unless copied into src/
              assets/Afterglow_logo.png|assets/Afterglow_logo.ico|assets/AfterglowBanner*.png|assets/avn-hub-logo.webp)
                continue
                ;;
              *)
                should=true
                break
                ;;
            esac
          done

          if [[ "$should" == true ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Code/config changes detected"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change; skipping package build"
          fi

  build-windows:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: windows-latest
    outputs:
      hub_tag: ${{ steps.hub.outputs.tag }}
      app_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match '^v(.+)$') { $v = $Matches[1] }
          elseif ($v -eq "main" -or $v -like "refs/*") { $v = "0.0.0-ci.${{ github.run_number }}" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "AppVersion=$v"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Afterglow.sln

      - name: Build
        run: dotnet build src/Afterglow/Afterglow.csproj -c Release -f net8.0-windows --no-restore

      - name: Resolve hub Windows sidecar
        id: hub
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HUB_GITHUB_TOKEN || github.token }}
          HUB_TAG: ${{ github.event.inputs.hub_tag }}
          HUB_REPO: ${{ vars.HUB_REPO || 'goonedoutgames/avn-hub' }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "$env:HUB_TAG".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = gh release view --repo $env:HUB_REPO --json tagName --jq .tagName
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Could not resolve latest release tag for $($env:HUB_REPO)"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using hub release: $tag"

          New-Item -ItemType Directory -Force -Path sidecar-dl | Out-Null
          gh release download $tag --repo $env:HUB_REPO `
            --pattern "avn-hub-windows-x64.exe" `
            --dir sidecar-dl --clobber
          if (-not (Test-Path "sidecar-dl/avn-hub-windows-x64.exe")) {
            gh release download $tag --repo $env:HUB_REPO `
              --pattern "avn-hub.exe" `
              --dir sidecar-dl --clobber
          }
          $src = @("sidecar-dl/avn-hub-windows-x64.exe", "sidecar-dl/avn-hub.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) { throw "No Windows avn-hub binary on release $tag" }
          "path=$src" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish Windows package
        shell: pwsh
        run: |
          ./packaging/publish-windows.ps1 `
            -Configuration Release `
            -Runtime win-x64 `
            -Framework net8.0-windows `
            -AvnHubExe "${{ steps.hub.outputs.path }}" `
            -Output publish/windows

      - name: Sidecar provenance
        shell: pwsh
        run: |
          @"
          Bundled AVN Hub sidecar (Windows)
          =================================
          Source repo : ${{ vars.HUB_REPO || 'goonedoutgames/avn-hub' }}
          Release tag : ${{ steps.hub.outputs.tag }}
          Asset       : ${{ steps.hub.outputs.path }}
          Built at    : $(Get-Date -Format o)
          "@ | Set-Content publish/windows/sidecar/SIDECAR.txt

      - name: Zip portable package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/windows/* -DestinationPath publish/Afterglow-windows-x64.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            throw "ISCC.exe not found after Inno Setup install"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          ./packaging/build-installer.ps1 `
            -SourceDir publish/windows `
            -OutputDir publish `
            -AppVersion "${{ steps.version.outputs.version }}" `
            -IconFile src/Afterglow/Assets/afterglow.ico `
            -InnoCompiler "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Afterglow-windows-x64
          path: |
            publish/Afterglow-windows-x64.zip
            publish/Afterglow-Setup-x64.exe
          if-no-files-found: error

  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: Afterglow-windows-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Afterglow-windows-x64.zip
            dist/Afterglow-Setup-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Afterglow desktop (Windows)

            - **Portable:** `Afterglow-windows-x64.zip` — extract and run `Afterglow.exe`
            - **Installer:** `Afterglow-Setup-x64.exe` — Start Menu / optional desktop shortcut / uninstall

            Requires the [.NET 8 Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/8.0).
            Includes Afterglow Browser (WebView2) and the Windows hub sidecar when available.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
